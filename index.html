<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extractor de Anuncio — ByZafiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F6F8;
    --bg-panel: #FFFFFF;
    --bg-field: #EEF0F3;
    --border: #D8DCE3;
    --text: #14171C;
    --text-dim: #5B6472;
    --accent: #0E7C86;
    --warn: #B4552C;
    --ok: #2E7D5B;
    --shadow: 0 1px 2px rgba(20,23,28,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1420; --bg-panel: #101D2E; --bg-field: #0C1826; --border: #223349;
      --text: #E7ECF3; --text-dim: #8CA0B8; --accent: #4FD6DE;
      --warn: #E8A87C; --ok: #7CD9AE; --shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; line-height: 1.5; padding: 28px 20px 60px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  header.page-head { margin-bottom: 22px; border-bottom: 1px solid var(--border); padding-bottom: 18px; }
  header.page-head h1 { font-size: 1.4rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  header.page-head p { margin: 4px 0 0; color: var(--text-dim); font-size: 0.9rem; }
  .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
  .panel h2 { font-size: 0.95rem; font-weight: 600; margin: 0 0 12px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.8rem; font-weight: 500; margin-bottom: 5px; color: var(--text-dim); }
  .field input[type=text] { width: 100%; background: var(--bg-field); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: inherit; font-size: 0.92rem; padding: 9px 10px; }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  button { font-family: inherit; font-size: 0.9rem; font-weight: 600; border-radius: 7px; padding: 10px 16px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
  button.primary { background: var(--accent); color: #04161A; }
  button.primary:disabled { opacity: 0.55; cursor: default; }
  button.ghost { background: transparent; border-color: var(--border); color: var(--text-dim); }
  button.ghost:hover { color: var(--text); border-color: var(--accent); }
  details summary { font-size: 0.8rem; color: var(--text-dim); cursor: pointer; }
  #status { font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
  .result-field { margin-bottom: 14px; }
  .result-field label { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 500; color: var(--text-dim); margin-bottom: 5px; }
  .result-field label button { font-size: 0.74rem; font-weight: 500; padding: 3px 8px; }
  .result-field textarea { width: 100%; background: var(--bg-field); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: inherit; font-size: 0.9rem; padding: 9px 10px; resize: vertical; min-height: 42px; }
  .result-empty { color: var(--text-dim); font-size: 0.88rem; text-align: center; padding: 30px 10px; }
  .thumb { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 4px; }
  footer.foot { color: var(--text-dim); font-size: 0.78rem; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="page-head">
    <h1>Extractor de Anuncio</h1>
    <p>Pega un enlace y saca el texto, precio e imagenes listos para copiar.</p>
  </header>

  <div class="panel">
    <h2>Enlace</h2>
    <div class="field">
      <div class="row">
        <input type="text" id="f_url" placeholder="https://www.idealista.com/inmueble/...">
        <button class="primary" id="btnExtraer">Extraer</button>
      </div>
    </div>
    <details>
      <summary>Configurar proxy de lectura</summary>
      <div class="field" style="margin-top:10px; margin-bottom:0;">
        <label>URL del proxy (Google Apps Script) <span style="opacity:0.75">se guarda en este navegador</span></label>
        <input type="text" id="f_proxy" placeholder="https://script.google.com/macros/s/XXXX/exec">
      </div>
    </details>
    <div id="status"></div>
  </div>

  <div class="panel" id="resultPanel">
    <h2>Resultado</h2>
    <div class="result-empty" id="resultEmpty">Aqui aparecera el texto extraido del anuncio.</div>
    <div id="resultBody" style="display:none;"></div>
  </div>

  <footer class="foot">Extractor de Anuncio · ByZafiro Real Estate</footer>
</div>

<script>
const proxyInput = document.getElementById('f_proxy');
try {
  const saved = localStorage.getItem('radar_proxy_url');
  if (saved) proxyInput.value = saved;
} catch (e) {}
proxyInput.addEventListener('change', () => {
  try { localStorage.setItem('radar_proxy_url', proxyInput.value.trim()); } catch (e) {}
});

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function setStatus(msg, kind) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = kind === 'ok' ? 'var(--ok)' : (kind === 'warn' ? 'var(--warn)' : 'var(--text-dim)');
}

function copyField(id, btn) {
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.value).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copiado';
    setTimeout(() => { btn.textContent = orig; }, 1200);
  }).catch(() => {});
}

function fichaToText(f) {
  if (!f) return '';
  const parts = [];
  if (f.superficie) parts.push(f.superficie);
  if (f.habitaciones) parts.push(f.habitaciones + ' habitaciones');
  if (f.banos) parts.push(f.banos + ' baño' + (f.banos === '1' ? '' : 's'));
  if (f.planta) parts.push('planta ' + f.planta);
  if (f.anio_construccion) parts.push('construido en ' + f.anio_construccion);
  if (f.ascensor) parts.push(f.ascensor === 'sí' ? 'con ascensor' : 'sin ascensor');
  if (f.garaje) parts.push('garaje mencionado');
  if (f.trastero) parts.push('trastero mencionado');
  if (f.terraza) parts.push('terraza mencionada');
  return parts.join(' · ');
}

function renderResult(data) {
  document.getElementById('resultEmpty').style.display = 'none';
  const body = document.getElementById('resultBody');
  body.style.display = 'block';

  const fichaTexto = fichaToText(data.ficha_tecnica);

  const fields = [
    ['title', 'Titulo', data.title],
    ['description', 'Descripcion', data.description],
    ['ficha', 'Ficha tecnica (aproximada, revisar)', fichaTexto],
    ['price_detectado', 'Precio detectado', data.price_detectado],
  ];

  let html = '';
  fields.forEach(([id, label, value]) => {
    html += `
      <div class="result-field">
        <label>${label} <button class="ghost" onclick="copyField('${id}', this)">Copiar</button></label>
        <textarea id="${id}" readonly>${esc(value || '(no detectado)')}</textarea>
      </div>`;
  });

  const imgs = Array.isArray(data.imagenes) ? data.imagenes.slice(0, 5) : [];
  html += `
    <div class="result-field">
      <label>Fotos detectadas (${imgs.length}${imgs.length < 5 ? ' de 5 objetivo' : ''})</label>
      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:8px;">
        ${imgs.map(u => `<img class="thumb" src="${esc(u)}" alt="Foto del anuncio" style="aspect-ratio:1; object-fit:cover;">`).join('')}
      </div>
      ${imgs.length === 0 ? '<p style="color:var(--text-dim); font-size:0.85rem; margin-top:6px;">No se ha detectado ninguna foto automaticamente; anadelas a mano si las necesitas.</p>' : ''}
    </div>`;

  html += `
    <div class="result-field" style="background:var(--bg-field); border-radius:8px; padding:12px;">
      <label style="margin-bottom:2px;">Estadisticas de contacto</label>
      <p style="font-size:0.85rem; color:var(--text-dim); margin:0;">${esc(data.estadisticas_nota || 'No disponibles automaticamente: son privadas del propietario en la mayoria de portales. Peagalas a mano.')}</p>
    </div>`;

  html += `
    <div class="result-field" style="margin-bottom:0;">
      <button class="primary" id="btnAbrirRadar" style="width:100%;">Abrir en Radar del Anuncio →</button>
    </div>`;

  body.innerHTML = html;

  document.getElementById('btnAbrirRadar').addEventListener('click', async () => {
    const RADAR_URL = 'https://claude.ai/artifact/8GW51hFdwbUTj5Q2ytEwgx';
    const textoCombinado = [data.title, data.description, data.price_detectado ? ('Precio detectado: ' + data.price_detectado) : '']
      .filter(Boolean).join('\n\n');
    const fotosTexto = imgs.length
      ? (imgs.length + ' imágenes detectadas en la página (revisar calidad manualmente).')
      : '';

    const payload = [
      '###RADAR_URL###', data.url || '',
      '###RADAR_TEXTO###', textoCombinado || '',
      '###RADAR_FICHA###', fichaTexto || '',
      '###RADAR_FOTOS###', fotosTexto || '',
      '###END###'
    ].join('\n');

    try {
      await navigator.clipboard.writeText(payload);
      setStatus('Datos copiados. Se abre Radar del Anuncio: pulsa allí "Pegar desde el Extractor".', 'ok');
    } catch (e) {
      setStatus('No se pudo copiar automáticamente; copia el resultado a mano.', 'warn');
    }
    window.open(RADAR_URL, '_blank');
  });
}

document.getElementById('btnExtraer').addEventListener('click', async () => {
  const url = document.getElementById('f_url').value.trim();
  const proxy = proxyInput.value.trim();
  const btn = document.getElementById('btnExtraer');

  if (!url) { setStatus('Pega primero el enlace del anuncio.', 'warn'); return; }
  if (!proxy) {
    setStatus('No hay proxy configurado: despliega radar-anuncio-proxy.gs en Google Apps Script y pega aqui la URL /exec.', 'warn');
    return;
  }

  btn.disabled = true;
  setStatus('Leyendo el anuncio...', null);

  try {
    const resp = await fetch(proxy + '?url=' + encodeURIComponent(url));
    const data = await resp.json();

    if (data.error) {
      setStatus(data.error, 'warn');
      return;
    }

    renderResult(data);

    if (data.warning) {
      setStatus(data.warning, 'warn');
    } else {
      setStatus('Extraccion completada. Revisa los campos antes de usarlos.', 'ok');
    }
  } catch (e) {
    setStatus('No se ha podido contactar con el proxy. Si esta pagina sigue en claude.ai, esta funcion necesita alojarse fuera (GitHub Pages) para funcionar.', 'warn');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
